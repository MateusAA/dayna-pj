  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7f0"/><stop offset="1" stop-color="#ffe3d1"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7d3a"/><stop offset="1" stop-color="#ec3236"/></linearGradient>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <circle cx="1030" cy="112" r="190" fill="#ff7d3a" opacity=".12"/>
  <circle cx="1090" cy="530" r="250" fill="#ec3236" opacity=".08"/>
